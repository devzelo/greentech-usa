# Render Blueprint — backend API for GreenTech USA.
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Then set the
# non-generated env vars (MONGO_URI, FRONTEND_URL, ALLOWED_ORIGINS) in the dashboard.
#
# IMPORTANT: a persistent Disk is required so uploaded documents survive deploys/restarts.
# Disks are only available on paid instance types (Starter+), NOT the free tier.
services:
  - type: web
    name: greentech-api
    runtime: node
    rootDir: backend
    plan: starter            # Starter+ required for the persistent disk below
    region: oregon           # pick the region closest to your users / Atlas cluster
    buildCommand: npm install --include=dev   # tsx runs the server, so keep devDependencies
    startCommand: npm start                    # tsx server/index.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong secret (rotating it logs everyone out)
      - key: MONGO_URI
        sync: false           # set in dashboard — your MongoDB Atlas connection string
      - key: FRONTEND_URL
        sync: false           # e.g. https://greentech-usa.vercel.app (used in reset emails)
      - key: ALLOWED_ORIGINS
        sync: false           # comma-separated frontend origins allowed by CORS
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads   # must match backend cwd/uploads
      sizeGB: 10
